name: drms-codespaces-demo

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    init: true
    environment:
      DB_PASSWORD: ${DRMS_DB_PASSWORD:?Set the DRMS_DB_PASSWORD Codespaces secret}
      DRMS_DEMO_PASSWORD: ${DRMS_DEMO_PASSWORD:?Set the DRMS_DEMO_PASSWORD Codespaces secret}
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: drms_demo
      MYSQL_USER: drms_demo
      MYSQL_PASSWORD: ${DRMS_DB_PASSWORD:?Set the DRMS_DB_PASSWORD Codespaces secret}
      MYSQL_ROOT_PASSWORD: ${DRMS_DB_ROOT_PASSWORD:?Set the DRMS_DB_ROOT_PASSWORD Codespaces secret}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping --host=127.0.0.1 --user=root --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    volumes:
      - drms-demo-mysql:/var/lib/mysql

volumes:
  drms-demo-mysql:
